    implementation files('libraries/accesskit.jar')
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
    }
}

// The sources are UTF-8. Without this, javac reads them in the system's default
// encoding: UTF-8 on a Mac, but the code page on Windows (usually Cp1252), which
// turns characters like the bullet in TextAdjust.java into three and fails.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {

        attributes(
                "Manifest-Version": "1.0",
                "Created-By": "Quorum",
                "Specification-Title": "Quorum Programming Language Standard Plugins",
                "Specification-Version": "10.0",
                "Class-Path": configurations.runtimeClasspath.collect { "libraries/" + it.getName() }.join(' '))
    }
    archiveFileName = 'QuorumStandardPlugins.jar'
}

test {
    //useJUnitPlatform()
}

// Copies the plugins jar and its libraries into the standard library. The
// copies are in doLast, after the jar task: a copy written directly in this
// block runs while Gradle sets up the build, and copies the previous build's
// jar. It's a plain task, not a Copy task, because Gradle skips a Copy task
// whose files (the libraries) haven't changed, and its doLast with it, so the
// new jar was never copied.
task copyToQuorum {
    dependsOn jar

    doLast {
        copy {
            from configurations.runtimeClasspath
            into '../../Quorum/Library/Compiled/Run/libraries'
        }
        copy {
            from jar.archiveFile
            into '../../Quorum/Library/Compiled/Run/'
        }
    }
}