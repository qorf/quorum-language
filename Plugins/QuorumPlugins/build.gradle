    runtimeOnly "org.lwjgl:lwjgl-bgfx::$lwjglMac"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglMac"
    runtimeOnly "org.lwjgl:lwjgl-nfd::$lwjglMac"
    runtimeOnly "org.lwjgl:lwjgl-openal::$lwjglMac"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglMac"
    runtimeOnly "org.lwjgl:lwjgl-opengles::$lwjglMac"
    runtimeOnly "org.lwjgl:lwjgl-stb::$lwjglMac"
    runtimeOnly "org.lwjgl:lwjgl-assimp::$lwjglMac"
    runtimeOnly "org.lwjgl:lwjgl-vulkan::$lwjglMac"
    runtimeOnly "org.lwjgl:lwjgl-shaderc::$lwjglMac"
    runtimeOnly "org.lwjgl:lwjgl-vma::$lwjglMac"

    runtimeOnly "org.lwjgl:lwjgl::$lwjglMacArm"
    runtimeOnly "org.lwjgl:lwjgl-bgfx::$lwjglMacArm"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglMacArm"
    runtimeOnly "org.lwjgl:lwjgl-nfd::$lwjglMacArm"
    runtimeOnly "org.lwjgl:lwjgl-openal::$lwjglMacArm"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglMacArm"
    runtimeOnly "org.lwjgl:lwjgl-opengles::$lwjglMacArm"
    runtimeOnly "org.lwjgl:lwjgl-stb::$lwjglMacArm"
    runtimeOnly "org.lwjgl:lwjgl-assimp::$lwjglMacArm"
    runtimeOnly "org.lwjgl:lwjgl-vulkan::$lwjglMacArm"
    runtimeOnly "org.lwjgl:lwjgl-shaderc::$lwjglMacArm"
    runtimeOnly "org.lwjgl:lwjgl-vma::$lwjglMacArm"

    //lwjglWindows64
    runtimeOnly "org.lwjgl:lwjgl::$lwjglWindows"
    runtimeOnly "org.lwjgl:lwjgl-bgfx::$lwjglWindows"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglWindows"
    runtimeOnly "org.lwjgl:lwjgl-nfd::$lwjglWindows"
    runtimeOnly "org.lwjgl:lwjgl-openal::$lwjglWindows"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglWindows"
    runtimeOnly "org.lwjgl:lwjgl-opengles::$lwjglWindows"
    runtimeOnly "org.lwjgl:lwjgl-stb::$lwjglWindows"
    runtimeOnly "org.lwjgl:lwjgl-assimp::$lwjglWindows"
