plugins {
    id 'java'
    id 'application'
}

// The operating system, from Java rather than Gradle's internal OperatingSystem
// class, which Gradle doesn't promise to keep.
def osName = System.getProperty("os.name").toLowerCase()
def isMac = osName.contains("mac")
def isWindows = osName.contains("windows")

group = 'plugins.quorum'
version = '10.0'

project.ext.lwjglVersion = "3.4.1"
project.ext.lwjglMac = "natives-macos"
project.ext.lwjglMacArm = "natives-macos-arm64"
project.ext.lwjglWindows = "natives-windows"
project.ext.lwjglWindows32 = "natives-windows-x86"

if (isMac) {
    project.ext.lwjglNatives = "natives-macos"
} else if (isWindows) {
    def osArch = System.getProperty("os.arch")
    project.ext.lwjglNatives = osArch.contains("64")
            ? "natives-windows${osArch.startsWith("aarch64") ? "-arm64" : ""}"
            : "natives-windows-x86"
}

repositories {
    mavenCentral()
    //google()
}

// Android's API (compile only), from the newest Android platform installed in
// the Android SDK (ANDROID_HOME, or where Android Studio puts it). The Android
// code needs API 31 or later; Quorum targets 36. Without an Android SDK, the
// old API 23 jar in the repository is used, which can't compile that code.
def androidSdk = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
if (androidSdk == null) {
    androidSdk = isWindows
            ? System.getenv("LOCALAPPDATA") + "/Android/Sdk"
            : System.getProperty("user.home") + "/Library/Android/sdk"
}
def androidJar = file('../GamePlugin/JavaGame/libs/android.jar')
def androidApi = 23
def androidPlatforms = file("$androidSdk/platforms").listFiles()
if (androidPlatforms != null) {
    def newest = androidPlatforms
            .findAll { new File(it, "android.jar").exists() && it.name ==~ /android-\d+.*/ }
            .max { (it.name =~ /android-(\d+)/)[0][1] as int }
    if (newest != null) {
        androidJar = new File(newest, "android.jar")
        androidApi = (newest.name =~ /android-(\d+)/)[0][1] as int
    }
}

// The newest Android API the plugins use (AccessibilityNodeInfo.setContainerTitle).
// Below it, stop with what to install rather than dozens of compile errors. This
// is checked only when compiling, so tasks like clean still work without an SDK.
// The user installs the SDK themselves: it asks them to accept Google's license.
def minimumAndroidApi = 34
tasks.named('compileJava') {
    doFirst {
        if (androidApi < minimumAndroidApi) {
            def found = androidApi == 23
                    ? "No Android SDK was found. Looked in ANDROID_HOME, ANDROID_SDK_ROOT and ${androidSdk}."
                    : "The Android SDK in ${androidSdk} only has API ${androidApi}. Quorum needs API ${minimumAndroidApi} or later."
            def steps = isWindows
                    ? """RUN THESE STEPS, IN ORDER:

  1. Install Android Studio. In a terminal, run:

       winget install Google.AndroidStudio

  2. Open Android Studio and finish its setup. It installs the Android SDK.
     Then open Settings > Languages & Frameworks > Android SDK.
     Under SDK Platforms, check Android 16 (API 36), and click OK.
     Accept the license when it asks.

  3. Build the standard library again."""
                    : """RUN THESE COMMANDS IN A TERMINAL, IN ORDER:

  1. Install the Android command-line tools (skip this if sdkmanager already works):

       brew install --cask android-commandlinetools

  2. Install the Android platform Quorum compiles against:

       sdkmanager --sdk_root="\$HOME/Library/Android/sdk" "platforms;android-36"

     It shows the Android SDK license. Read it, type y, and press Return.
     (Keep --sdk_root as it is: that's where this build looks.)

  3. Build the standard library again.

  These need Homebrew (https://brew.sh) and Java 17 or later (check with: java -version).
  Or, instead of steps 1 and 2: install Android Studio (https://developer.android.com/studio),
  open Settings > Languages & Frameworks > Android SDK, and install Android 16 (API 36)."""
            throw new GradleException("""
==============================================================================
 Quorum's Android plugins need the Android SDK (API 36).
 ${found}
==============================================================================

${steps}

If the Android SDK is installed somewhere else, set ANDROID_HOME to its folder.
==============================================================================""")
        }
    }
}



